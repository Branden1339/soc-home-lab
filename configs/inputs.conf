# Splunk Universal Forwarder input configuration
# Located at: C:\Program Files\SplunkUniversalForwarder\etc\system\local\inputs.conf
# Monitors the Sysmon Operational event log channel and forwards to the
# "main" index on the Splunk indexer.

[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = false
index = main
